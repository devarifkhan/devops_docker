version: '3'
services:
  redis:
    image: redis:alpine
    ports:
      - "6379"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"

  vote:
    image: dockersamples/examplevotingapp_vote
    ports:
      - "5000:80"
    depends_on:
      - redis

  worker:
    image: dockersamples/examplevotingapp_worker
    depends_on:
      - db
      - redis

  result:
    image: dockersamples/examplevotingapp_result
    ports:
      - "5001:80"
    depends_on:
      - db